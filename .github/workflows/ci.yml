name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Build (Debug, JIT) - includes the NuGet vulnerability audit
      - run: dotnet build LeafCalendar.slnx -c Debug

      # Logic Tests (UI and live tests run locally or by manual trigger)
      - run: dotnet test --project tests/LeafCalendar.Tests/LeafCalendar.Tests.csproj -c Debug --no-build

  # Package Size (manual): Release AOT MSIX, no AI libraries, under budget
  package:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: pwsh tools/publish-aot.ps1

      - run: pwsh tools/check-package.ps1

  # UI Tests (manual): registers the Debug build on the runner, then drives it with FlaUI
  ui-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Developer Mode (dev-register.ps1 registers a loose package layout, which needs it)
      - name: Turn on Developer Mode
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          if (-not (Test-Path $key)) { New-Item -Path $key | Out-Null }
          Set-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense -Type DWord -Value 1

      - run: pwsh tools/dev-register.ps1

      - run: dotnet test --project tests/LeafCalendar.UITests/LeafCalendar.UITests.csproj -c Debug
