name: Docs

# Builds the user guide in site/ with Jekyll and publishes it to GitHub Pages (artistro08.github.io/leaf-calendar).
# Needs Settings › Pages › Source set to "GitHub Actions" once.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/api.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Deploy At A Time (a newer push waits instead of canceling the one in progress)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      # API Reference (docs/api.md stays the only copy; it gets its page's front matter here)
      - name: Add the API reference
        run: |
          {
            printf -- '---\ntitle: API reference\nparent: Connected apps\nnav_order: 1\n---\n\n'
            cat docs/api.md
          } > site/api.md

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
