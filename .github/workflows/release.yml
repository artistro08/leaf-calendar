name: Release

# A version tag (v0.1.305) builds the signed Release (Native AOT) MSIX and publishes a GitHub release with it and the
# certificate that verifies it. The changelog is the list of commits since the previous version tag (merges and version
# bumps left out), followed by the install steps. The signing certificate lives only in the repository secrets
# (SIGNING_PFX, base64; SIGNING_PASSWORD).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # Full History (the changelog needs the previous version tag and the commits since it)
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Version Check: the tag names the manifest's version (v0.1.305 is 0.1.305.0)
      - name: Check the version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/LeafCalendar.App/Package.appxmanifest -Raw)).Package.Identity.Version
          if ("v$version" -ne "$env:TAG.0") { throw "Tag $env:TAG doesn't match the manifest's version $version." }
          "VERSION=$version" >> $env:GITHUB_ENV
          "NAME=$($env:TAG.TrimStart('v'))" >> $env:GITHUB_ENV

      # Signing Certificate: from the repository secrets into this runner's store, and its public half for the release
      - name: Import the signing certificate
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX))
          $password = ConvertTo-SecureString $env:SIGNING_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          Export-Certificate -Cert $cert -FilePath LeafCalendar.cer | Out-Null
          "THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      # Signed MSIX (the AOT linker setup calls vswhere.exe by bare name)
      - name: Publish the signed MSIX
        shell: pwsh
        run: |
          $env:PATH += ";${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          dotnet publish src/LeafCalendar.App/LeafCalendar.App.csproj -c Release -r win-x64 -p:Platform=x64 `
              -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=true -p:PackageCertificateThumbprint=$env:THUMBPRINT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msix = Get-ChildItem src/LeafCalendar.App/AppPackages -Recurse -Filter '*.msix' | Select-Object -First 1
          Copy-Item $msix.FullName "LeafCalendar_$($env:VERSION)_x64.msix"

      # Package Size: no AI libraries, under budget
      - run: pwsh tools/check-package.ps1

      # Changelog: every commit since the previous version tag (the whole history for the first one), merges and version
      # bumps left out, then the install steps
      - name: Write the changelog
        shell: pwsh
        run: |
          $previous = git describe --tags --abbrev=0 --match 'v*' "$env:TAG^" 2>$null
          $range = if ($LASTEXITCODE -eq 0) { "$previous..$env:TAG" } else { $env:TAG }
          $changes = git log $range --no-merges --format='- %s' | Where-Object { $_ -notmatch '^- chore\(release\)' }
          $notes = @(
              '## Changes'
              ''
              $changes
              ''
              '## Install or update'
              ''
              "1. Download ``LeafCalendar.cer`` and ``LeafCalendar_$($env:VERSION)_x64.msix`` below."
              '2. If you haven''t trusted this certificate before, trust it once, in an elevated PowerShell:'
              ''
              '    ```powershell'
              '    Import-Certificate -FilePath .\LeafCalendar.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople'
              '    ```'
              ''
              '3. Double-click the `.msix`. It installs as an update, so your accounts, settings and saved times are kept.'
              ''
              'Requires Windows 11 (x64). See the [README](https://github.com/artistro08/leaf-calendar#readme) and [PRIVACY.md](https://github.com/artistro08/leaf-calendar/blob/main/PRIVACY.md).'
          )
          Set-Content -Path notes.md -Value $notes -Encoding utf8

      # Release: the installer and its certificate, published as the latest
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG --latest --title "Leaf Calendar $env:NAME" --notes-file notes.md "LeafCalendar_$($env:VERSION)_x64.msix" LeafCalendar.cer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
