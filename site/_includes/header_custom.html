{%- comment -%} Light and Dark Toggle (head_custom.html does the switching) {%- endcomment -%}
<button
    type="button"
    class="leaf-theme-toggle"
    title="Switch between light and dark"
    aria-label="Switch between light and dark"
    onclick="window.leafToggleTheme()"
>
    <svg class="leaf-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
    <svg class="leaf-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5 1 3h-2zm0 20-1-3h2zM2 12l3-1v2zm20 0-3 1v-2zM4.9 4.9l2.8 1.4-1.4 1.4zm14.2 14.2-2.8-1.4 1.4-1.4zM4.9 19.1l1.4-2.8 1.4 1.4zM19.1 4.9l-1.4 2.8-1.4-1.4z"/>
    </svg>
</button>
