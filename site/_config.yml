title: Leaf Calendar
description: A fast, native Windows 11 app for your Google Calendar. Heavily inspired by Notion Calendar.
url: https://artistro08.github.io
baseurl: /leaf-calendar
permalink: pretty

remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme

# Theme (leaf and leaf-dark in _sass/color_schemes; head_custom.html switches between them)
color_scheme: leaf
favicon_ico: /assets/images/logo-64.png
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top
aux_links:
  Download:
    - https://github.com/artistro08/leaf-calendar/releases/latest
  GitHub:
    - https://github.com/artistro08/leaf-calendar
aux_links_new_tab: true
footer_content: Leaf Calendar is open source. <a href="https://github.com/artistro08/leaf-calendar/blob/main/PRIVACY.md">Privacy</a>

# Callouts
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: yellow
  warning:
    title: Warning
    color: red
